<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; worker-src 'self' blob:;">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Beanzo | Premium Coffee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              coffee: {
                50: '#fdf8f6',
                100: '#f2e8e5',
                200: '#eaddd7',
                300: '#e0cec7',
                400: '#d2bab0',
                500: '#a18072',
                600: '#8a6254',
                700: '#5e4036',
                800: '#4a322a',
                900: '#2b1810',
                950: '#1a0f0a',
              },
              accent: {
                DEFAULT: '#D97706',
                hover: '#B45309'
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Poppins"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <script>
      // Check local storage and apply dark mode immediately to prevent flash
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
    <style>
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fdf8f6;
      }
      ::-webkit-scrollbar-thumb {
        background: #a18072;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8a6254;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1a0f0a;
      }
      .text-shadow {
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      }
      .text-shadow-light {
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-scroll": "https://esm.sh/react-scroll@^1.9.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
  <body class="bg-coffee-50 dark:bg-coffee-950 text-coffee-900 dark:text-coffee-100 font-sans antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
