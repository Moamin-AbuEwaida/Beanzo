<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF5E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6D2B5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Saucer -->
  <ellipse cx="50" cy="75" rx="35" ry="10" fill="#3E2723" stroke="#281815" stroke-width="2"/>
  
  <!-- Handle -->
  <path d="M70,40 C82,35 85,55 70,60" fill="none" stroke="#E6D2B5" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Cup Body -->
  <path d="M25,30 Q25,70 50,70 Q75,70 75,30" fill="url(#cupGrad)" stroke="#D7CCC8" stroke-width="1"/>
  <ellipse cx="50" cy="30" rx="25" ry="8" fill="#4E342E"/> <!-- Coffee liquid surface -->
  
  <!-- Steam -->
  <path d="M40,15 Q35,5 40,0" fill="none" stroke="#FFCC80" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  <path d="M50,10 Q45,0 50,-5" fill="none" stroke="#FFCC80" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  <path d="M60,15 Q55,5 60,0" fill="none" stroke="#FFCC80" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
</svg>